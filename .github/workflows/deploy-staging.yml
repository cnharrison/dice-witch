name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy
        required: true
        type: string
      apply_migrations:
        description: Authorize remote staging D1 migration application
        required: true
        default: false
        type: boolean
      allow_gateway_deploy:
        description: Acknowledge that deploying Gateway can reconnect the staging bot
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type deploy-staging
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: dice-witch-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      REQUESTED_SHA: ${{ inputs.sha }}
      APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
      ALLOW_GATEWAY_DEPLOY: ${{ inputs.allow_gateway_deploy }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate dispatch authorization
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_CONFIRMATION" == "deploy-staging" ]]
          [[ "$ALLOW_GATEWAY_DEPLOY" == "true" ]]

      - name: Check out workflow source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify workflow source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Require successful exact-SHA CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/verify-ci-promotion.mjs --sha "$REQUESTED_SHA"

      - name: Check out validated source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify validated source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Run complete quality gates through Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: v0.21.9
          call: ci --source=. --sha=${{ inputs.sha }} --run-nonce=${{ github.run_id }}.${{ github.run_attempt }}.staging-quality

      - name: Generate deployment metadata
        id: metadata
        run: printf 'build_time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"

      - name: Deploy staging through Dagger
        uses: dagger/dagger-for-github@v8.4.1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_CONFIG_B64: ${{ secrets.STAGING_CONFIG_B64 }}
          STAGING_GATEWAY_ORIGIN: ${{ secrets.STAGING_GATEWAY_ORIGIN }}
          STAGING_PRODUCTION_DENYLIST_B64: ${{ secrets.STAGING_PRODUCTION_DENYLIST_B64 }}
          STAGING_ROLL_ORIGIN: ${{ secrets.STAGING_ROLL_ORIGIN }}
        with:
          version: v0.21.9
          call: staging-deploy --source=. --sha=${{ inputs.sha }} --build-time=${{ steps.metadata.outputs.build_time }} --run-nonce=${{ github.run_id }}.${{ github.run_attempt }}.staging-deploy --apply-migrations=${{ inputs.apply_migrations }} --allow-gateway-deploy=${{ inputs.allow_gateway_deploy }} --config-bundle=env://STAGING_CONFIG_B64 --production-denylist=env://STAGING_PRODUCTION_DENYLIST_B64 --roll-origin=env://STAGING_ROLL_ORIGIN --gateway-origin=env://STAGING_GATEWAY_ORIGIN --cloudflare-api-token=env://CLOUDFLARE_API_TOKEN --cloudflare-account-id=env://CLOUDFLARE_ACCOUNT_ID
