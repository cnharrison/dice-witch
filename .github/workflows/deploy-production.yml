name: Deploy production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy
        required: true
        type: string
      apply_migrations:
        description: Authorize any pending production D1 migrations
        required: true
        default: false
        type: boolean
      allow_gateway_deploy:
        description: Acknowledge that Gateway deployment reconnects the production bot
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type deploy-production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dice-witch-production-deployment
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      REQUESTED_SHA: ${{ inputs.sha }}
      APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
      ALLOW_GATEWAY_DEPLOY: ${{ inputs.allow_gateway_deploy }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate dispatch authorization
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_CONFIRMATION" == "deploy-production" ]]
          [[ "$APPLY_MIGRATIONS" == "true" || "$APPLY_MIGRATIONS" == "false" ]]
          [[ "$ALLOW_GATEWAY_DEPLOY" == "true" ]]

      - name: Check out exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.0

      - name: Verify successful CI promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/verify-ci-promotion.mjs --sha "$REQUESTED_SHA"

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://dicewit.ch
    env:
      REQUESTED_SHA: ${{ inputs.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Generate deployment metadata
        id: metadata
        run: printf 'build_time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"

      - name: Deploy production through Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          PRODUCTION_VALUES_B64: ${{ secrets.PRODUCTION_VALUES_B64 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          version: v0.21.9
          call: production-deploy --source=. --sha=${{ inputs.sha }} --build-time=${{ steps.metadata.outputs.build_time }} --run-nonce=${{ github.run_id }}.${{ github.run_attempt }} --apply-migrations=${{ inputs.apply_migrations }} --allow-gateway-deploy=${{ inputs.allow_gateway_deploy }} --values=env://PRODUCTION_VALUES_B64 --cloudflare-api-token=env://CLOUDFLARE_API_TOKEN --cloudflare-account-id=env://CLOUDFLARE_ACCOUNT_ID
